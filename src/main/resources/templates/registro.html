<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Reporte Diario - Petramás</title>
    <style>
        /* Empuja el contenido hacia abajo para que la barra fija no lo tape */
        body {
            padding-top: 110px; 
        }
    </style>
</head>
<body class="bg-light">

    <!-- Barra de Navegación Fija (Fixed Top) -->
    <nav class="navbar navbar-dark bg-primary shadow-sm py-2 fixed-top">
        <div class="container-fluid flex-column align-items-stretch">
            <!-- Fila Superior: Título de la vista y Botón Volver -->
            <div class="d-flex justify-content-between align-items-center w-100 mb-2">
                <span class="navbar-brand mb-0 h6 text-wrap fw-bold lh-sm">
                    Petramás | Registro
                </span>
                <!-- Botón Volver integrado en la barra -->
                <a th:href="@{${rolUsuario == 'Administrador' ? '/admin' : '/dashboard'}}" 
                   class="btn btn-light btn-sm fw-bold text-primary shadow-sm px-3">
                   ← Volver
                </a>
            </div>
            <!-- Fila Inferior: Usuario y Botón Cerrar Sesión -->
            <div class="d-flex justify-content-between align-items-center w-100 mt-1">
                <span class="text-white small fw-semibold" th:text="'👤 ' + ${usuarioActual.nombreApellido}"></span>
                <a th:href="@{/logout}" class="btn btn-danger btn-sm fw-bold px-2 py-1" style="font-size: 0.85rem;">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

<div class="container mt-4 mb-5">
    
    <!-- Alertas -->
    <div th:if="${param.exito}" class="alert alert-success shadow-sm text-center fw-bold">
        ¡Reporte guardado correctamente!
    </div>
    <div th:if="${errorHoras}" class="alert alert-danger shadow-sm border-danger mb-4 fw-bold text-center">
        <span th:text="${errorHoras}"></span>
    </div>

    <div class="card shadow-sm border-primary border-top border-4">
        <div class="card-header bg-white text-center py-3 border-bottom">
            <h5 class="mb-0 fw-bold text-primary" th:text="${modoEdicion} ? '✏️ Editar Actividad' : '⏱️ Nuevo Reporte Diario'">Reporte Diario</h5>
        </div>
        
        <div class="card-body p-4">
            <!-- Formulario enlazado al objeto 'registro' de Spring -->
            <form th:action="@{/reporte}" th:object="${registro}" method="post">
                
                <!-- CAMPO OCULTO: Vital para la actualización -->
                <input type="hidden" th:field="*{idRegistro}">

                <!-- Soldador (Solo lectura) -->
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">Operario:</label>
                    <input type="text" class="form-control bg-light text-muted" th:value="${usuarioActual.nombreApellido}" readonly>
                </div>

                <!-- EL ATAJO MÁGICO PARA ÓRDENES NUEVAS -->
                <div class="mb-3 p-3 bg-white border rounded shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="form-label fw-bold text-dark mb-0">Orden de Trabajo:</label>
                        <!-- Enlace que salva la vida si no encuentra su orden -->
                        <a th:href="@{/admin/ordenes}" class="badge bg-success text-decoration-none p-2 fw-bold shadow-sm" style="font-size: 0.85rem;">
                            ➕ ¿Falta una? Créala aquí
                        </a>
                    </div>
                    <select class="form-select form-select-lg fs-6" th:field="*{ordenTrabajo.idOrden}" required>
                        <option value="">Seleccione la orden de la lista...</option>
                        <option th:each="ord : ${ordenes}" th:value="${ord.idOrden}" th:text="${ord.idOrden + ' - ' + ord.equipo}"></option>
                    </select>
                </div>

                <!-- NUEVO: Selector de Compañero para duplicar registro -->
                <div class="mb-4 bg-light p-3 rounded border border-secondary border-opacity-25">
                    <label class="form-label fw-bold text-secondary">👥 ¿Trabajaste con un compañero?</label>
                    <select name="dniCompanero" class="form-select">
                        <option value="">-- Ninguno (Trabajo Individual) --</option>
                        <th:block th:each="op : ${listaOperarios}">
                            <!-- Evita listarse a sí mismo -->
                            <option th:if="${op.dni != usuarioActual.dni}" th:value="${op.dni}" th:text="${op.nombreApellido}"></option>
                        </th:block>
                    </select>
                    <div class="form-text small mt-1">Si seleccionas a alguien, esta actividad se duplicará automáticamente en su cuenta.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">Fecha de la Actividad:</label>
                    <input type="date" class="form-control" id="fecha" name="fecha" th:value="${registro.fecha}" required>
                </div>

                <div class="row bg-light p-2 rounded mx-0 mb-3">
                    <div class="col-6">
                        <label class="form-label fw-bold text-secondary">Hora Inicio:</label>
                        <input type="time" class="form-control" th:field="*{horaInicio}" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-bold text-secondary">Hora Fin:</label>
                        <input type="time" class="form-control" th:field="*{horaFin}" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary">Actividad Realizada:</label>
                    <textarea class="form-control" th:field="*{actividad}" rows="3" placeholder="Describe brevemente el trabajo que realizaste en este horario..." required></textarea>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm" th:text="${modoEdicion} ? 'Actualizar Reporte' : 'Guardar Reporte'">Guardar Reporte</button>
                    <a th:if="${modoEdicion}" th:href="@{/dashboard}" class="btn btn-outline-secondary fw-bold">Cancelar Edición</a>
                </div>
            </form>
            
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
