<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Petramás - Iniciar Sesión</title>
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-lg border-0 rounded-lg mt-5">
                <div class="card-header bg-primary text-white text-center py-4">
                    <h4 class="mb-0 fw-bold">Mantenimiento Petramás</h4>
                </div>
                <div class="card-body p-4">
                    
                    <!-- Mensaje de error (DNI/Clave incorrecta) -->
                    <div th:if="${error != null}" class="alert alert-danger text-center fw-bold" th:text="${error}"></div>
                    
                    <!-- Mensaje de cierre de sesión -->
                    <div th:if="${param.logout}" class="alert alert-info text-center fw-bold">Sesión cerrada exitosamente</div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">Número de DNI</label>
                            <input type="text" name="dni" class="form-control form-control-lg" required maxlength="8" placeholder="Ingrese su DNI">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold text-secondary">Clave de Acceso</label>
                            <input type="password" name="clave" class="form-control form-control-lg" required placeholder="Ingrese su clave">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold">INGRESAR</button>
                        </div>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
