<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Dashboard Admin - Petramás</title>
</head>
<body class="bg-light">

<!-- Barra de Navegación Superior -->
<!-- Barra de Navegación Unificada -->
<nav class="navbar navbar-dark bg-primary shadow-sm py-3">
    <div class="container-fluid flex-column align-items-start">
        
        <!-- Línea 1: Título con text-wrap para que no se corte en celulares -->
        <span class="navbar-brand mb-2 h5 text-wrap fw-bold lh-sm">
            Petramás | Registro de Usuarios
        </span>
        
        <!-- Línea 2: Usuario a la izquierda y Botón a la derecha -->
        <div class="d-flex justify-content-between align-items-center w-100">
            <span class="text-white" th:text="'Admin: ' + ${nombreAdmin}"></span>
            <a th:href="@{/logout}" class="btn btn-light text-danger btn-sm fw-bold">Cerrar Sesión</a>
			 </div>
        
    </div>
</nav>

<div class="container-fluid mt-4">
	<!-- Botón Volver -->
	    <div class="mb-3">
	        <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm fw-bold">← Volver al Dashboard</a>
	    </div>
    
    <!-- Mensaje de éxito -->
    <div th:if="${param.exito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <strong>¡Excelente!</strong> El usuario ha sido registrado correctamente. Su DNI es su clave de acceso.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row">
        <!-- Columna Izquierda: Formulario de Nuevo Personal -->
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
				<div class="card-header bg-primary text-white">
				                    <!-- Cambia el título si estamos editando -->
				                    <h5 class="mb-0" th:text="${modoEdicion != null ? 'Editar Personal' : 'Registrar Nuevo Personal'}"></h5>
				                </div>
				                <div class="card-body">
				                    <form th:action="@{/admin/guardarPersonal}" th:object="${nuevoOperario}" method="post">
				                        <div class="mb-3">
				                            <label class="form-label fw-bold">DNI</label>
				                            <!-- El atributo th:readonly bloquea el campo si estamos editando -->
				                            <input type="text" class="form-control" th:field="*{dni}" maxlength="8" required placeholder="Ej: 71234567" th:readonly="${modoEdicion != null}">
				                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre y Apellido</label>
                            <input type="text" class="form-control" th:field="*{nombreApellido}" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Especialidad</label>
                            <select class="form-select" th:field="*{especialidad}" required>
                                <option value="">Seleccione el cargo...</option>
                                <option value="Administrador">Administrador</option>
                                <option value="Soldador">Soldador</option>
                                <option value="Mecánico">Mecánico</option>
                                <option value="Electricista">Electricista</option>
                                <option value="Pintor">Pintor</option>
                            </select>
                        </div>
						
						<div class="mb-4">
						                            <label class="form-label fw-bold">Estado del Personal</label>
						                            <select class="form-select" th:field="*{estado}" required>
						                                <option value="Activo">Activo</option>
						                                <option value="Inactivo">Inactivo</option>
						                            </select>
						</div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">Guardar Usuario</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Columna Derecha: Lista de Personal -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Directorio de Personal</h5>
                    <span class="badge bg-light text-dark" th:text="${#lists.size(listaPersonal)} + ' Registrados'"></span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped mb-0">
							<thead class="table-light">
							                                <tr>
							                                    <th>DNI</th>
							                                    <th>Nombre Completo</th>
							                                    <th>Especialidad</th>
							                                    <th class="text-center">Estado</th>
							                                    <th class="text-center">Acciones</th> <!-- NUEVA COLUMNA -->
							                                </tr>
							                            </thead>
							                            <tbody>
							                                <tr th:each="per : ${listaPersonal}">
							                                    <td class="fw-bold" th:text="${per.dni}"></td>
							                                    <td th:text="${per.nombreApellido}"></td>
							                                    <td>
							                                        <span class="badge" 
							                                              th:classappend="${per.especialidad == 'Administrador' ? 'bg-danger' : 'bg-info'}"
							                                              th:text="${per.especialidad}"></span>
							                                    </td>
							                                    <td class="text-center">
																	<span class="badge" 
																	                                              th:classappend="${per.estado == 'Activo' ? 'bg-success' : 'bg-secondary'}" 
																	                                              th:text="${per.estado != null ? per.estado : 'Activo'}">
																	                                        </span>
							                                    </td>
																<td class="text-center">
																        <!-- BOTÓN DE EDITAR (El que ya tienes) -->
																        <a th:href="@{/admin/editar/{id}(id=${per.dni})}" class="btn btn-warning btn-sm fw-bold text-dark me-1">Editar</a>
																        
																        <!-- NUEVO BOTÓN DE ELIMINAR -->
																        <a th:if="${per.estado == null or per.estado == 'Activo'}" 
																           th:href="@{/admin/eliminar/{id}(id=${per.dni})}" 
																           class="btn btn-danger btn-sm fw-bold"
																           onclick="return confirm('¿Desactivar a este trabajador? Ya no podrá iniciar sesión.');">
																           X
																        </a>
																    </td>
							                                </tr>
							                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
