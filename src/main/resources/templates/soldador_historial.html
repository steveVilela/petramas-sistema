<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Mi Historial - Petramás</title>
</head>
<body class="bg-light">

	<!-- Barra de Navegación Unificada Responsiva -->
	<nav class="navbar navbar-dark bg-primary shadow-sm py-3">
	    <div class="container-fluid flex-column align-items-start">
	        <span class="navbar-brand mb-2 h5 text-wrap fw-bold lh-sm">
	            Petramás | Historial de Actividades
	        </span>
	        <div class="d-flex justify-content-between align-items-center w-100">
	            <span class="text-white small" th:text="'Usuario: ' + ${nombreUsuario}"></span>
				<a th:href="@{/logout}" class="btn btn-light text-danger btn-sm fw-bold">Cerrar Sesión</a>
			</div>
	    </div>
	</nav>

<div class="container mt-4 mb-5">
    <!-- Botón Volver -->
    <div class="mb-3">
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm fw-bold">← Volver al Panel</a>
    </div>

    <!-- FILTRO POR CALENDARIO -->
    <div class="card shadow-sm border-0 mb-3">
        <div class="card-body bg-white">
            <form method="get" th:action="@{/historial}" class="row g-2 align-items-center">
                <div class="col-8">
                    <label for="fechaFiltro" class="form-label small fw-bold text-secondary mb-1">📅 Seleccionar Día:</label>
                    <input type="date" id="fechaFiltro" name="fechaFiltro" class="form-control form-control-sm" 
                           th:value="${fechaSeleccionada}" onchange="this.form.submit()">
                </div>
                <div class="col-4 text-end pt-3">
                    <a th:href="@{/historial}" class="btn btn-outline-secondary btn-sm w-100">Hoy</a>
                </div>
            </form>
        </div>
    </div>

	<!-- Indicador del Total de Horas del Día Seleccionado -->
	    <div class="alert alert-dark d-flex flex-column py-2 mb-3 bg-white border">
	        <div class="d-flex justify-content-between align-items-center w-100">
	            <span class="small fw-bold">Total Neto del Día:</span>
	            <span class="badge bg-success fs-6" th:text="${totalHorasDia}">0 h 00 m</span>
	        </div>

	        <!-- SI EL DÍA TIENE 0 HORAS (Descanso / Libre): Muestra un aviso sutil sin alertas rojas -->
	        <div class="mt-2 text-center text-muted small" th:if="${minutosTotalesDia != null and minutosTotalesDia == 0}">
	            <span>🌴 Día sin registros (Descanso / Feriado)</span>
	        </div>

	        <!-- SI FALTAN HORAS (Entre 1 min y 479 min): Muestra el botón para completar el día -->
	        <div class="mt-2 text-center" th:if="${minutosTotalesDia != null and minutosTotalesDia > 0 and minutosTotalesDia < 480}">
	            <a th:href="@{/reporte/nuevo(fecha=${fechaSeleccionada})}" class="btn btn-primary btn-sm w-100 fw-bold">
	                ⏰ Registrar hora faltante para completar el día
	            </a>
	        </div>
	    </div>

    <!-- Si no hay registros en la fecha seleccionada -->
    <div th:if="${#lists.isEmpty(registros)}" class="alert.alert-warning text-center py-4 bg-white shadow-sm rounded">
        No hay actividades registradas en esta fecha.
    </div>

    <!-- Contenedor de Tarjetas del Día -->
    <div class="d-flex flex-column gap-3">
        <div th:each="reg : ${registros}" class="card shadow-sm border-0">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center py-2">
                <span class="fw-bold small" th:text="${reg.fecha}">Fecha</span>
                <span class="badge bg-light text-dark font-monospace" th:text="${reg.horaInicio + ' - ' + reg.horaFin}">Horario</span>
            </div>
            <div class="card-body p-3">
                <div class="d-flex justify-content-between align-items-start gap-2">
                    <div class="flex-grow-1">
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <span class="badge bg-success" th:text="${reg.ordenTrabajo.idOrden}">Orden</span>
                            <span class="fw-bold text-dark small" th:text="${reg.ordenTrabajo.equipo}">Equipo</span>
                        </div>
                        <p class="mb-2 text-secondary small lh-sm" th:text="${reg.actividad}">Descripción...</p>
                    </div>
                    <div class="d-flex flex-column gap-1">
                        <a th:href="@{/reporte/editar/{id}(id=${reg.idRegistro})}" 
                           class="btn btn-outline-primary btn-sm px-2 py-1 fw-bold" title="Editar">✏️</a>
                        <a th:href="@{/reporte/eliminar/{id}(id=${reg.idRegistro})}" 
                           class="btn btn-outline-danger btn-sm px-2 py-1 fw-bold" 
                           onclick="return confirm('¿Seguro que deseas eliminar este registro?');" title="Eliminar">❌</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
