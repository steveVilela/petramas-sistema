<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Mi Historial - Petramás</title>
</head>
<body class="bg-light">


	<!-- Barra de Navegación Unificada Responsiva -->
	<nav class="navbar navbar-dark bg-primary shadow-sm py-3">
	    <div class="container-fluid flex-column align-items-start">
	        <span class="navbar-brand mb-2 h5 text-wrap fw-bold lh-sm">
	            Petramás | Historial de Actividades
	        </span>
	        <div class="d-flex justify-content-between align-items-center w-100">
	            <!-- Usa usuarioActual que es la variable que tienes en tu formulario -->
	            <span th:text="'Usuario: ' + ${nombreUsuario}"></span>
				<a th:href="@{/logout}" class="btn btn-light text-danger btn-sm fw-bold">Cerrar Sesión</a>
			</div>
	    </div>
	</nav>

<div class="container mt-4">
    <!-- Botón Volver -->
    <div class="mb-3">
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm fw-bold">← Volver al Panel</a>
    </div>

	<div class="card shadow-sm border-0">
	    <div class="card-header bg-secondary text-white">
	        <h6 class="mb-0 fw-bold">Todos mis registros</h6>
	    </div>
	    <!-- table-responsive permite deslizar si la pantalla es muy pequeña -->
	    <div class="table-responsive">
	        <!-- table-sm reduce los márgenes internos para que quepan más datos -->
	        <table class="table table-sm table-striped table-hover align-middle mb-0">
	            <thead class="table-light text-secondary">
	                <tr>
						<th>Fecha</th>
						<th>Orden y Horario</th>
						<th>Actividad</th>
						<th class="text-center">Acción</th> <!-- NUEVA COLUMNA -->
	                </tr>
	            </thead>
	            <tbody>
	                <tr th:each="reg : ${registros}">
	                    <!-- 1. Fecha: text-nowrap evita que el año se separe del mes -->
	                    <td class="text-nowrap text-center fw-bold small" th:text="${reg.fecha}"></td>
	                    
	                     <!-- 2. Orden, Equipo y Horario: Apilados en la misma celda -->
	                    <td class="text-nowrap">
	                        <span class="badge bg-success mb-1" th:text="${reg.ordenTrabajo.idOrden}"></span><br>
	                        <small class="text-dark fw-bold d-block text-truncate" style="max-width: 150px;" th:text="${reg.ordenTrabajo.equipo}"></small>
	                        <small class="text-muted" th:text="${reg.horaInicio + ' - ' + reg.horaFin}"></small>
	                    </td>

	                    
	                    <!-- 3. Actividad: Letra más pequeña para que quepa mejor el texto -->
	                    <td class="small lh-sm text-wrap" th:text="${reg.actividad}"></td>
						<!-- Debajo del td de Actividad... -->
						    <td class="text-center">
    <div class="d-flex justify-content-center gap-1">
        <!-- Botón Modificar -->
        <a th:href="@{/reporte/editar/{id}(id=${reg.idRegistro})}" 
           class="btn btn-outline-primary btn-sm px-2 py-0 fw-bold">
            ✏️
        </a>
        
        <!-- Botón Eliminar existente -->
        <a th:href="@{/reporte/eliminar/{id}(id=${reg.idRegistro})}" 
           class="btn btn-outline-danger btn-sm px-2 py-0 fw-bold" 
           onclick="return confirm('¿Seguro que deseas eliminar este registro histórico?');">
            X
        </a>
    </div>
</td>

					
					</tr>
	            </tbody>
	        </table>
	    </div>
	</div>
</div>

</body>
</html>
