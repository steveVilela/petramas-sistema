# Conexión 100% dinámica
spring.datasource.url=jdbc:postgresql://ep-steep-sky-aee6fhn4-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_FQlNpmYZ5C9e
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8080

# (Mantén aquí el resto de tus configuraciones de spring.jpa e idle-timeout)

# Configuración de Hibernate para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Evitar errores de conexión inactiva en la nube
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000

# Forzar reintentos de conexión ante el despertar de la BD
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5


